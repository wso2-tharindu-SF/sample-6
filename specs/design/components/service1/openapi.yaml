openapi: 3.0.3
info:
  title: Service1 API
  version: 0.1.0
  description: Reports the average score of Service2's current catalog.
servers:
  - url: /
paths:
  /average-score:
    get:
      operationId: getAverageScore
      summary: Average score across Service2's current catalog
      responses:
        '200':
          description: The computed average score
          content:
            application/json:
              schema:
                type: object
                required: [average]
                properties:
                  average:
                    type: integer
                    description: Sum of every record's score divided by the record count, truncated to a whole number

openapi: 3.0.3
info:
  title: Service2 API
  version: 0.1.0
  description: Serves a fixed catalog of scored records and an internal mode-switch control.
servers:
  - url: /
paths:
  /catalog:
    get:
      operationId: getCatalog
      summary: The current catalog of scored records
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Max records to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Records to skip
      responses:
        '200':
          description: The current catalog
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count:
                    type: integer
                    description: total matching records
                  next:
                    type: string
                    nullable: true
                    description: relative URI of the next page
                  previous:
                    type: string
                    nullable: true
                    description: relative URI of the previous page
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Record'
  /operations/mode:
    post:
      operationId: setCatalogMode
      summary: Switch the catalog between full and empty mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [full, empty]
                  description: Catalog mode to switch to
      responses:
        '200':
          description: Mode switched
          content:
            application/json:
              schema:
                type: object
                required: [mode]
                properties:
                  mode:
                    type: string
                    enum: [full, empty]
                    description: The catalog's mode after the switch
        '400':
          description: The requested mode is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Record:
      type: object
      required: [id, name, score]
      properties:
        id:
          type: integer
          description: Record identifier
        name:
          type: string
          description: Record name
        score:
          type: integer
          description: Record score
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: HTTP or application error code
        message:
          type: string
          description: short human-readable label
        description:
          type: string
          description: detailed explanation
        moreInfo:
          type: string
          description: URI to documentation
